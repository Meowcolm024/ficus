name: ficus
version: 0.1.0.0
github: Meowcolm024/ficus
license: BSD-3-Clause
author: Meowcolm024
copyright: 2026 Meowcolm024

extra-source-files:
  - README.md
  - CHANGELOG.md
  - docs/SPEC.md
  - docs/ERRORS.md
  - test/fixtures/**/*.ficus
  - test/fixtures/**/expectations.json
  - test/fixtures/semantics/type-checking/positive-expectations.json
  - test/fixtures/semantics/type-checking/reference/*.txt
  - test/fixtures/semantics/type-checking/verify-references.py
  - test/fixtures/**/README.md

data-files:
  - library/**/*.ficus
  - library/README.md

description: Please see the README on GitHub at <https://github.com/Meowcolm024/ficus#readme>

dependencies:
  - base >= 4.7 && < 5
  - text
  - megaparsec
  - containers
  - mtl
  - transformers
  - vector
  - pretty
  - directory
  - filepath
  - stm
  - ansi-terminal

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints
  - -Wunused-imports
  - -fprint-explicit-foralls
  - -fprint-explicit-kinds
  - -Werror

default-extensions:
  - DataKinds
  - DerivingVia
  - GADTs
  - LambdaCase
  - MultiWayIf
  - NoStarIsType
  - OverloadedStrings
  - StrictData
  - TypeFamilies
  - ViewPatterns

language: GHC2021

library:
  source-dirs: src

executables:
  ficus:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - ficus
      - optparse-applicative
      - haskeline

tests:
  ficus-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - ficus
      - tasty
      - tasty-hunit
      - tasty-quickcheck
      - QuickCheck
      - aeson
